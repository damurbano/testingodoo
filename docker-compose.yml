services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  odoo:
    image: odoo:17
    
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - ./odoo-data/.local:/var/lib/odoo/.local
      - ./addons:/mnt/extra-addons
      - ./config/odooTest.conf:/etc/odoo/odoo.conf
    environment:
      - HOST=db

volumes:
  odoo-db-data:
